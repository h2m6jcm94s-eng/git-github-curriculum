name: Validate Curriculum Answers

on:
  pull_request:
    branches: [main, master]

  # Allow manual trigger for debugging
  workflow_dispatch:

# Let the default GITHUB_TOKEN post the results comment on the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate Student Answers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can diff against the PR base branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git --version

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run validation
        run: python tests/validate.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'validation-report.json';
            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (e) {
              report = { summary: { passed: 0, failed: 0, total: 0 }, lessons: [] };
            }

            const { summary, lessons } = report;
            const status = summary.failed === 0 ? '✅ PASSED' : '❌ FAILED';

            let body = `## ${status} — Curriculum Validation Report\n\n`;
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| ✅ Passed | ${summary.passed} |\n`;
            body += `| ❌ Failed | ${summary.failed} |\n`;
            body += `| 📋 Total | ${summary.total} |\n\n`;

            if (lessons.length > 0) {
              body += `### Lesson Results\n\n`;
              body += `| Lesson | Status | Details |\n`;
              body += `|--------|--------|---------|\n`;
              for (const lesson of lessons) {
                const icon = lesson.passed ? '✅' : '❌';
                const details = lesson.errors.join('; ') || 'All checks passed';
                body += `| ${lesson.path} | ${icon} | ${details} |\n`;
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Curriculum Validation Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
